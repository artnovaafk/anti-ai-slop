<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="300" fill="#ffffff"/>

  <rect x="260" y="20" width="400" height="44" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="460" y="47" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">любое сообщение модели в ZCode</text>

  <line x1="460" y1="64" x2="460" y2="88" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="92" width="560" height="30" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="460" y="112" text-anchor="middle" font-size="12.5" fill="#1f2328">правила anti-ai-slop в контексте модели</text>

  <line x1="180" y1="122" x2="180" y2="152" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="122" x2="460" y2="152" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="122" x2="740" y2="152" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="156" width="280" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect x="40" y="156" width="280" height="30" rx="10" fill="#ddf4ff"/>
    <text x="180" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da">SessionStart-хук</text>
    <text x="180" y="208" text-anchor="middle" font-size="11.5" fill="#59636e">компактные правила в каждую</text>
    <text x="180" y="224" text-anchor="middle" font-size="11.5" fill="#59636e">сессию, для любой модели</text>
  </g>
  <g>
    <rect x="320" y="156" width="280" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect x="320" y="156" width="280" height="30" rx="10" fill="#dafbe1"/>
    <text x="460" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1a7f37">скилл anti-ai-slop</text>
    <text x="460" y="208" text-anchor="middle" font-size="11.5" fill="#59636e">полный свод на задачах кода,</text>
    <text x="460" y="224" text-anchor="middle" font-size="11.5" fill="#59636e">дизайна, доков и копирайта</text>
  </g>
  <g>
    <rect x="600" y="156" width="280" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect x="600" y="156" width="280" height="30" rx="10" fill="#fff1e5"/>
    <text x="740" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#9e6a03">/anti-slop:check</text>
    <text x="740" y="208" text-anchor="middle" font-size="11.5" fill="#59636e">аудит файлов или недавних</text>
    <text x="740" y="224" text-anchor="middle" font-size="11.5" fill="#59636e">изменений + исправление</text>
  </g>

  <line x1="180" y1="242" x2="180" y2="258" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="242" x2="460" y2="258" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="242" x2="740" y2="258" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="262" width="560" height="30" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="460" y="282" text-anchor="middle" font-size="12.5" fill="#1f2328">выдача без слопа — а по явному запросу «сделай градиент» будет градиент</text>
</svg>
